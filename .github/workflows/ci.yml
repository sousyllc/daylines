name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: node --test test/*.test.mjs
      - name: CLI smoke test
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          node bin/daylines help
          node bin/daylines
